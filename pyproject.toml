[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-report-demo"
version = "0.1.0"
description = "Ukázka: automatizace týdenního reportu pro malou firmu se schvalovacím krokem (syntetická data)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jaroslav Kučera" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "streamlit>=1.50",
    "altair>=5",
    "fpdf2>=2.8",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["report_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
